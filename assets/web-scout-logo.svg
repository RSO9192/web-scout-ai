<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">web-scout-ai logo</title>
  <desc id="desc">web-scout-ai wordmark with a W inside a magnifying lens and the tagline Web research that reads the sources.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1d17"/>
      <stop offset="100%" stop-color="#07110f"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect x="10" y="10" width="1180" height="300" rx="18" fill="none" stroke="#8fffc2" stroke-opacity="0.12" stroke-width="2"/>

  <g transform="translate(44,38)">
    <circle cx="106" cy="104" r="88" fill="#0a1612" stroke="url(#brand)" stroke-width="14"/>
    <path d="M51 66 L70 142 L106 97 L142 142 L161 66"
          fill="none" stroke="#effff7" stroke-width="18"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M169 167 L220 218"
          fill="none" stroke="url(#brand)" stroke-width="18"
          stroke-linecap="round"/>
  </g>

  <text x="310" y="143" fill="#effff7" font-size="76"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
        font-weight="700" letter-spacing="-3">web-scout<tspan fill="#4ade80">-ai</tspan></text>

  <text x="314" y="196" fill="#a6bdb3" font-size="24"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-weight="500">Web research that reads the sources.</text>

  <g transform="translate(314,228)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="600" letter-spacing="1.5">
    <text x="0" y="17" fill="#4ade80">SEARCH</text>
    <circle cx="83" cy="12" r="3" fill="#55756a"/>
    <text x="102" y="17" fill="#6ee7b7">EXTRACT</text>
    <circle cx="197" cy="12" r="3" fill="#55756a"/>
    <text x="216" y="17" fill="#22d3ee">CITE</text>
  </g>
</svg>
