<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">web-scout-ai logo mark</title>
  <desc id="desc">A geometric W inside a green-to-cyan magnifying lens.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1d17"/>
      <stop offset="100%" stop-color="#07110f"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#background)"/>
  <rect x="28" y="28" width="968" height="968" rx="198" fill="none" stroke="#8fffc2" stroke-opacity="0.14" stroke-width="4"/>

  <g filter="url(#shadow)">
    <circle cx="460" cy="438" r="266" fill="#0a1612" stroke="url(#brand)" stroke-width="46"/>
    <path d="M294 318 L352 548 L460 412 L568 548 L626 318"
          fill="none" stroke="#effff7" stroke-width="58"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M648 626 L818 796"
          fill="none" stroke="url(#brand)" stroke-width="58"
          stroke-linecap="round"/>
  </g>
</svg>
