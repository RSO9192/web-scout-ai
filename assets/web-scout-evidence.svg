<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">What web-scout-ai returns</title>
  <desc id="desc">A sentence from the synthesis cites the Indonesian Ministry of Forestry; result.scraped holds the extract from that page with the same Red List Index figures; the audit trail lists every URL found, read, rejected or left unopened.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1d17"/>
      <stop offset="100%" stop-color="#07110f"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="28" fill="url(#background)"/>
  <rect x="12" y="12" width="1176" height="536" rx="22" fill="none" stroke="#1f3a30" stroke-width="2"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <!-- Answer -->
    <text x="48" y="64" fill="#4ade80" font-size="15" font-weight="700" letter-spacing="1.5"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">result.synthesis</text>
    <rect x="48" y="80" width="500" height="248" rx="16" fill="#0d211a" stroke="#4ade80" stroke-opacity="0.25"/>
    <text x="72" y="118" fill="#a6bdb3" font-size="18">
      <tspan x="72">“…The clearest recent national-level</tspan>
      <tspan x="72" dy="28">indicator—not a hotspot-by-hotspot</tspan>
      <tspan x="72" dy="28">measure—is the <tspan fill="#effff7" font-weight="600">Red List Index: it fell</tspan></tspan>
      <tspan x="72" dy="28" fill="#effff7" font-weight="600">from 0.77 in 2018 to 0.75 in 2024;</tspan>
      <tspan x="72" dy="28" fill="#effff7" font-weight="600">Indonesia’s 2025–2029 strategic plan</tspan>
      <tspan x="72" dy="28" fill="#effff7" font-weight="600">sets a target of 0.76 by 2029.<tspan fill="#a6bdb3" font-weight="400">”</tspan></tspan>
    </text>
    <rect x="72" y="276" width="356" height="32" rx="8" fill="#0f2e2c" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="86" y="297" fill="#67e8f9" font-size="15">[Deputy Minister: Biodiversity Status…]</text>

    <!-- Arrow -->
    <path d="M556 204 C 590 204, 600 204, 636 204" fill="none" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Evidence -->
    <text x="652" y="64" fill="#22d3ee" font-size="15" font-weight="700" letter-spacing="1.5"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">result.scraped[i]</text>
    <rect x="652" y="80" width="500" height="248" rx="16" fill="#0b1f22" stroke="#22d3ee" stroke-opacity="0.3"/>
    <text x="676" y="112" fill="#67e8f9" font-size="14"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">url: kehutanan.go.id/pers/wamenhut-…</text>
    <text x="676" y="136" fill="#a6bdb3" font-size="14"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">content:</text>
    <text x="676" y="166" fill="#a6bdb3" font-size="17">
      <tspan x="676">“Indonesia’s Red List Index (RLI), an</tspan>
      <tspan x="676" dy="26">aggregate indicator of species extinction</tspan>
      <tspan x="676" dy="26">risk and SDG indicator 15.5.1, <tspan fill="#effff7" font-weight="600">fell from</tspan></tspan>
      <tspan x="676" dy="26" fill="#effff7" font-weight="600">0.77 in 2018 to 0.75 in 2024. The Ministry’s</tspan>
      <tspan x="676" dy="26" fill="#effff7" font-weight="600">2025–2029 strategic plan sets a target for</tspan>
      <tspan x="676" dy="26" fill="#effff7" font-weight="600">the RLI to rise to 0.76 by 2029.<tspan fill="#a6bdb3" font-weight="400"> …”</tspan></tspan>
    </text>

    <!-- Audit trail -->
    <text x="48" y="384" fill="#4ade80" font-size="15" font-weight="700" letter-spacing="1.5"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">audit trail — every URL accounted for</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16">
      <rect x="48" y="404" width="196" height="52" rx="12" fill="#0d211a" stroke="#4ade80" stroke-opacity="0.35"/>
      <text x="68" y="437" fill="#effff7"><tspan fill="#4ade80" font-weight="700">8</tspan>  scraped</text>

      <rect x="258" y="404" width="270" height="52" rx="12" fill="#0d211a" stroke="#55756a" stroke-opacity="0.6"/>
      <text x="278" y="437" fill="#effff7"><tspan fill="#a6bdb3" font-weight="700">3</tspan>  scraped_irrelevant</text>

      <rect x="542" y="404" width="262" height="52" rx="12" fill="#0d211a" stroke="#55756a" stroke-opacity="0.6"/>
      <text x="562" y="437" fill="#effff7"><tspan fill="#a6bdb3" font-weight="700">1</tspan>  source_http_error</text>

      <rect x="818" y="404" width="334" height="52" rx="12" fill="#0d211a" stroke="#55756a" stroke-opacity="0.6"/>
      <text x="838" y="437" fill="#effff7"><tspan fill="#a6bdb3" font-weight="700">17</tspan>  snippet_only, never cited</text>
    </g>
    <text x="48" y="500" fill="#a6bdb3" font-size="16">From one call: <tspan fill="#effff7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">run_web_research("Indonesia biodiversity hotspots current status and recent trend")</tspan></text>
  </g>
</svg>
